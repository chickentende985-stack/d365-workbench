# 自动打包：每次推送到 main，在 GitHub 的 Windows 机器上打一个包（Actions 页面下载）；
# 推送 v 开头的标签（如 v0.2.0）时，再把包发布到 Releases。
name: 打包

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 基础测试
        run: python -m unittest discover -v tests

      - name: 写入版本号（仅标签发版）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sed -i "s/^APP_VERSION = .*/APP_VERSION = '${GITHUB_REF_NAME#v}'/" app/__init__.py
          cat app/__init__.py

      - name: PyInstaller 打包
        shell: bash
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name D365Workbench
          --add-data "app/ui;app/ui"
          --add-data "app/engine;app/engine"
          --hidden-import app.main
          --collect-all playwright
          run_app.py

      - name: 冒烟测试（不开窗口启动打包后的程序，调一次接口）
        shell: bash
        timeout-minutes: 5
        run: |
          export D365_WORKBENCH_DATA="$RUNNER_TEMP/wb-data"
          ./dist/D365Workbench/D365Workbench.exe --no-window --port 8765 &
          ok=""
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 -X POST http://127.0.0.1:8765/api/app_info -d '[]' > info.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "程序没有启动"; cat "$D365_WORKBENCH_DATA/logs/app.log" || true; exit 1; fi
          cat info.json
          grep -q '"ok": true' info.json
          curl -sf --max-time 5 http://127.0.0.1:8765/ | grep -q 'D365'
          echo "打包后的程序启动正常"

      - name: 压缩
        shell: pwsh
        run: Compress-Archive -Path dist/D365Workbench -DestinationPath D365Workbench-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: D365Workbench-windows
          path: D365Workbench-windows.zip
          retention-days: 30

      - name: 发布到 Releases（仅标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: D365Workbench-windows.zip
          generate_release_notes: true
