# 自动打包：每次推送到 main，在 GitHub 的 Windows 机器上打包，
# 并按 app/__init__.py 里的 APP_VERSION 发布到 Releases（同一版本号再推送会覆盖那个版本的安装包）。
name: 打包

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 基础测试
        run: python -m unittest discover -v tests

      - name: 读版本号
        id: ver
        shell: bash
        run: |
          v=$(python -c "import app; print(app.APP_VERSION)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本 $v"

      - name: PyInstaller 打包
        shell: bash
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name D365Workbench
          --add-data "app/ui;app/ui"
          --add-data "app/engine;app/engine"
          --add-data "app/ops/ops.js;app/ops"
          --hidden-import app.main
          --collect-all playwright
          run_app.py

      - name: 冒烟测试（不开窗口启动打包后的程序，调一次接口）
        shell: bash
        timeout-minutes: 5
        run: |
          export D365_WORKBENCH_DATA="$RUNNER_TEMP/wb-data"
          ./dist/D365Workbench/D365Workbench.exe --no-window --port 8765 &
          ok=""
          for i in $(seq 1 40); do
            if curl -sf --max-time 5 -X POST http://127.0.0.1:8765/api/app_info -d '[]' > info.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "程序没有启动"; cat "$D365_WORKBENCH_DATA/logs/app.log" || true; exit 1; fi
          cat info.json
          grep -q '"ok": true' info.json
          curl -sf --max-time 5 http://127.0.0.1:8765/ | grep -q 'D365'
          echo "打包后的程序启动正常"

      - name: 压缩
        shell: pwsh
        run: Compress-Archive -Path dist/D365Workbench -DestinationPath D365Workbench-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: D365Workbench-windows
          path: D365Workbench-windows.zip
          retention-days: 30

      - name: 发布到 Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: D365Workbench-windows.zip
          overwrite_files: true
          body_path: RELEASE_NOTES.md
